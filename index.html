html[data-tema="grafite"]{--bg:#1c1917;--glow:#2d2618;--acc:#d4a017;--accd:#1c1503;--tx:#ede8e3;--mu:#a8a29e;--in:#292524;--ln:#3b3631;--k1:#3d3628;--k2:#24201a;--k3:#151310;--chip1:#f2d58a;--chip2:#9c7414;
 --pat:linear-gradient(rgba(212,160,23,.06) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(212,160,23,.06) 1px,transparent 1px) 0 0/28px 28px}
html[data-tema="prata"]{--bg:#0c0c0c;--glow:#1c1c1e;--acc:#cfd2d6;--accd:#0c0c0c;--tx:#fafafa;--mu:#8a8a8a;--in:#1a1a1a;--ln:#2e2e2e;--k1:#3a3d42;--k2:#1d1f22;--k3:#0e0f10;--chip1:#f1f2f4;--chip2:#8d9096;
 --pat:repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 6px,transparent 6px 12px)}
*{box-sizing:border-box}
.staticrypt-html,.staticrypt-body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .3s}
.staticrypt-body{background:var(--pat),radial-gradient(700px 420px at 50% 0%,var(--glow),var(--bg) 70%) fixed;background-color:var(--bg)}
.staticrypt-html,.staticrypt-body{height:100%;overflow:hidden;overscroll-behavior:none}.staticrypt-content{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}.staticrypt-page{display:flex;justify-content:center;width:100%}@media (max-height:600px){.scene{display:none}}
.staticrypt-form{width:100%;max-width:360px}
.tsw{display:flex;gap:6px;justify-content:flex-end;margin-bottom:18px}
.tsw button{display:flex;align-items:center;gap:6px;background:var(--in);color:var(--mu);border:1px solid var(--ln);border-radius:999px;padding:4px 10px;font:12px system-ui,sans-serif;cursor:pointer}
.tsw button i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.25)}
.tsw button.on{color:var(--tx);border-color:var(--acc)}
.kk{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);margin:0}.kk span{color:var(--mu);margin-right:8px}
.staticrypt-title{font-size:22px;font-weight:600;margin:2px 0 16px}
.scene{perspective:900px;margin-bottom:18px}
.card{position:relative;height:200px;border-radius:16px;padding:20px;overflow:hidden;background:linear-gradient(135deg,var(--k1),var(--k2) 55%,var(--k3));
 border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);box-shadow:0 26px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);transform:rotateX(8deg) rotateY(-12deg);transition:transform .5s,background .3s}
.card:hover{transform:none}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.1) 45%,transparent 60%);animation:shine 4s ease-in-out infinite;pointer-events:none}
.card.err{animation:shake .45s}
.tp{display:flex;justify-content:space-between;align-items:center}
.chip{width:42px;height:32px;border-radius:6px;background:linear-gradient(135deg,var(--chip1),var(--chip2));position:relative}.chip::before{content:"";position:absolute;inset:7px 5px;border:1px solid rgba(0,0,0,.3);border-radius:3px}
.brand{font-size:11px;letter-spacing:.2em;font-weight:700;color:var(--acc)}
.num{font:600 22px/1 ui-monospace,Consolas,monospace;letter-spacing:.14em;margin:32px 0 20px}.num b{color:var(--acc);font-weight:600}
.bt{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}.bt strong{display:block;color:var(--tx);font-size:12px;letter-spacing:.05em}
.staticrypt-password-container{position:relative}
.staticrypt-form input[type="password"],.staticrypt-form input[type="text"]{width:100%;background:var(--in);color:var(--tx);border:1px solid var(--ln);border-radius:11px;padding:13px 46px 13px 14px;font:600 18px ui-monospace,Consolas,monospace;letter-spacing:.28em;outline:0}
.staticrypt-form input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.staticrypt-toggle-password-visibility{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;cursor:pointer;opacity:.55;filter:invert(1)}
.staticrypt-toggle-password-visibility:hover{opacity:1}
label.staticrypt-remember{display:flex;align-items:center;gap:8px;margin:12px 0 0;color:var(--mu);font-size:13px;cursor:pointer}
.staticrypt-remember input[type="checkbox"]{accent-color:var(--acc);width:16px;height:16px;margin:0}
.perr{min-height:18px;margin:8px 0 0;color:#f87171;font-size:13px}
.staticrypt-form .staticrypt-decrypt-button{width:100%;margin-top:8px;background:var(--acc);color:var(--accd);border:0;border-radius:11px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
.staticrypt-form .staticrypt-decrypt-button:hover,.staticrypt-form .staticrypt-decrypt-button:focus{filter:brightness(1.08);outline:2px solid var(--tx);outline-offset:2px}
.hidden{display:none!important}
.staticrypt-spinner-container{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center}
.staticrypt-spinner{width:36px;height:36px;border:3px solid var(--ln);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{0%,100%{transform:translateX(-60%)}50%{transform:translateX(60%)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.card::after,.card.err{animation:none}}

/* senha certa: cartão aprovado e entrada no relatório */
.scene{position:relative}
.scene::after{content:"";position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid var(--acc);opacity:0;pointer-events:none}
.fin-ok .scene::after{animation:ring .9s ease-out}
.fin-ok .card{transform:none;animation:okPulse .9s ease-out;box-shadow:0 0 0 2px var(--acc),0 0 70px color-mix(in srgb,var(--acc) 55%,transparent),0 26px 50px rgba(0,0,0,.6)}
.fin-ok .card::after{animation:sweep .8s ease-in-out 1}
.fin-ok .chip{animation:chipGlow .9s ease-out}
.fin-ok .num{animation:pop .4s ease-out}.fin-ok .num b{color:#22c55e}
.fin-ok .tsw,.fin-ok .kk,.fin-ok .staticrypt-title,.fin-ok #staticrypt-form{transition:opacity .35s,transform .35s;opacity:0;transform:translateY(14px);pointer-events:none}
.fin-go .card{transition:transform .6s cubic-bezier(.6,0,.2,1),opacity .55s,filter .55s;transform:translateY(-24px) scale(1.55);opacity:0;filter:blur(8px)}
@keyframes okPulse{0%{transform:scale(1)}35%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes sweep{from{transform:translateX(-80%)}to{transform:translateX(80%)}}
@keyframes chipGlow{50%{box-shadow:0 0 22px var(--chip1)}}
@keyframes pop{from{transform:scale(.85);opacity:0}}
@keyframes ring{from{transform:scale(.4);opacity:.9}to{transform:scale(3.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.fin-ok .card,.fin-ok .scene::after,.fin-ok .num,.fin-ok .chip{animation:none}}
