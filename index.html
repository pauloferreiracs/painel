<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Painel financeiro</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
:root{--bg:#160d0f;--paper:#1f1416;--paper2:#2a1b1e;--line:#3d2a2e;--acc:#b87333;--tx:#f3e9e7;--mu:#a89290;--neg:#f87171}
*{box-sizing:border-box}
.staticrypt-html,.staticrypt-body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.staticrypt-body{background:radial-gradient(1200px 600px at 50% -10%,#2a1418 0%,var(--bg) 60%)}
.staticrypt-content,.staticrypt-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.staticrypt-form{width:100%;max-width:380px;background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:14px;padding:28px 26px 24px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.staticrypt-instructions p{margin:0}
.staticrypt-kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);font-weight:600}
.staticrypt-kicker span{color:var(--mu);margin-right:8px}
.staticrypt-title{font-size:24px;font-weight:600;margin:6px 0 4px!important}
.staticrypt-instructions p:last-child{color:var(--mu);font-size:13px}
.staticrypt-hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.staticrypt-password-container{position:relative}
.staticrypt-form input[type="password"],.staticrypt-form input[type="text"]{width:100%;background:var(--paper2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:13px 44px 13px 14px;font-size:18px;letter-spacing:.12em;outline:0;font-variant-numeric:tabular-nums}
.staticrypt-form input[type="password"]:focus,.staticrypt-form input[type="text"]:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(184,115,51,.18)}
.staticrypt-toggle-password-visibility{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;cursor:pointer;opacity:.6;filter:invert(85%) sepia(10%) saturate(300%) hue-rotate(330deg)}
.staticrypt-toggle-password-visibility:hover{opacity:1}
label.staticrypt-remember{display:flex;align-items:center;gap:8px;margin:14px 0 4px;color:var(--mu);font-size:13px;cursor:pointer}
.staticrypt-remember input[type="checkbox"]{accent-color:var(--acc);width:16px;height:16px;margin:0}
.staticrypt-form .staticrypt-decrypt-button{width:100%;margin-top:16px;background:var(--acc);color:#1a0f0a;border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:700;letter-spacing:.04em;cursor:pointer}
.staticrypt-form .staticrypt-decrypt-button:hover,.staticrypt-form .staticrypt-decrypt-button:focus{filter:brightness(1.08);outline:2px solid var(--tx);outline-offset:2px}
.hidden{display:none!important}
.staticrypt-spinner-container{min-height:100vh;display:flex;align-items:center;justify-content:center}
.staticrypt-spinner{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
    </head>
